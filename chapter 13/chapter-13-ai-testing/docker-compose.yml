services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chapter13-postgres
    environment:
      POSTGRES_DB: acme_ai
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: chapter13-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: chapter13-open-webui
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    profiles:
      - ui

volumes:
  postgres_data:
  ollama_data: