spring:
  application:
    name: chapter-13-ai-testing
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local-test-key}
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

acme:
  ai:
    quality:
      prompt-accuracy-threshold: ${AI_QUALITY_PROMPT_ACCURACY:95}
      grounded-responses-threshold: ${AI_QUALITY_GROUNDED_RESPONSES:98}
      tool-selection-threshold: ${AI_QUALITY_TOOL_SELECTION:99}
      workflow-completion-threshold: ${AI_QUALITY_WORKFLOW_COMPLETION:99}
      unauthorized-tool-calls-threshold: ${AI_QUALITY_UNAUTHORIZED_TOOL_CALLS:0}
      hallucination-rate-max-threshold: ${AI_QUALITY_HALLUCINATION_RATE_MAX:2}
    evaluations:
      result-json-path: ${AI_EVALUATION_RESULT_JSON:target/evaluations/latest-results.json}
      result-html-path: ${AI_EVALUATION_RESULT_HTML:target/evaluations/latest-results.html}
  security:
    evaluator-username: ${ACME_EVALUATOR_USERNAME:evaluator}
    evaluator-password: ${ACME_EVALUATOR_PASSWORD:evaluator-pass}
    evaluator-role: ${ACME_EVALUATOR_ROLE:EVALUATOR}

server:
  port: 8080