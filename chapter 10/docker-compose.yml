services:
  hr-db:
    image: postgres:17
    container_name: chapter10-hr-db
    environment:
      POSTGRES_DB: hr_mcp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - hr_db_data:/var/lib/postgresql/data

  # Optional PGVector container for future vectorized policy search experiments.
  hr-pgvector:
    image: pgvector/pgvector:pg17
    container_name: chapter10-hr-pgvector
    environment:
      POSTGRES_DB: hr_vector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - hr_pgvector_data:/var/lib/postgresql/data
    profiles:
      - vector

  mcp-hr-server:
    container_name: chapter10-mcp-hr-server
    build:
      context: .
      dockerfile: docker/mcp-hr-server.Dockerfile
    depends_on:
      - hr-db
    environment:
      HR_DB_URL: jdbc:postgresql://hr-db:5432/hr_mcp
      HR_DB_USER: postgres
      HR_DB_PASSWORD: postgres
      HR_SERVER_PORT: 8091
    ports:
      - "8091:8091"

  ollama:
    image: ollama/ollama:latest
    container_name: chapter10-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  mcp-enterprise-assistant-client:
    container_name: chapter10-mcp-enterprise-assistant-client
    build:
      context: .
      dockerfile: docker/mcp-enterprise-assistant-client.Dockerfile
    depends_on:
      - mcp-hr-server
      - ollama
    environment:
      HR_MCP_SERVER_URL: http://mcp-hr-server:8091
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2
      OLLAMA_TEMPERATURE: 0.1
      ASSISTANT_PORT: 8090
    ports:
      - "8090:8090"

volumes:
  hr_db_data:
  hr_pgvector_data:
  ollama_data: