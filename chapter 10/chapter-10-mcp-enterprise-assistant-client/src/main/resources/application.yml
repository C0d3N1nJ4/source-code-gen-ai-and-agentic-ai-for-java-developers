spring:
  application:
    name: chapter-10-mcp-enterprise-assistant-client
  ai:
    mcp:
      client:
        name: chapter-10-mcp-enterprise-assistant-client
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            hr-server:
              url: ${HR_MCP_SERVER_URL:http://localhost:8091}
              endpoint: /mcp
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: ${OLLAMA_TEMPERATURE:0.1}

server:
  port: ${ASSISTANT_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
