version: '3.9'
services:
  assistant-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: acme/chapter-15-enterprise-ai-deployment:1.0.0
    container_name: assistant-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ASSISTANT_SECURITY_BEARER_TOKEN: dev-token
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-pgvector:5432/assistant
      SPRING_DATASOURCE_USERNAME: assistant
      SPRING_DATASOURCE_PASSWORD: assistant
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      ASSISTANT_MCP_BASE_URL: http://mock-mcp-server:8081
    depends_on:
      - postgres-pgvector
      - ollama
      - mock-mcp-server

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  postgres-pgvector:
    image: pgvector/pgvector:pg17
    container_name: postgres-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    volumes:
      - pgvector-data:/var/lib/postgresql/data

  mock-mcp-server:
    image: wiremock/wiremock:3.8.0
    container_name: mock-mcp-server
    ports:
      - "8081:8080"
    command: ["--global-response-templating", "--verbose"]

volumes:
  pgvector-data:
  ollama-data:
