spring:
  application:
    name: chapter-15-enterprise-ai-deployment
  datasource:
    url: jdbc:postgresql://localhost:5432/assistant
    username: assistant
    password: assistant
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
assistant:
  security:
    bearer-token: ${ASSISTANT_SECURITY_BEARER_TOKEN:dev-token}
  mcp:
    base-url: ${ASSISTANT_MCP_BASE_URL:http://localhost:8081}
    allow-list:
      - hr.lookup
      - finance.lookup
      - it.lookup
      - operations.lookup
  tools:
    allow-list:
      - weather
      - employee-directory
      - company-policies
      - calendar
      - calculator
  routing:
    local-small-model: llama3.1:8b
    default-model: qwen3:8b
    reasoning-model: deepseek-r1:14b
    coding-model: qwen2.5-coder:7b
    cloud-fallback-model: gpt-4.1-mini
  resilience:
    timeout-ms: 30000
