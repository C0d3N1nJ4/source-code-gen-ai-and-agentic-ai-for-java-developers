services:
  ollama:
    image: ollama/ollama:latest
    container_name: chapter5-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chapter5-embeddings-search-app
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-data:
