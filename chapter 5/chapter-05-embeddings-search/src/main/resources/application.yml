spring:
  application:
    name: acme-enterprise-assistant-chapter5
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

acme:
  assistant:
    default-chunk-size: ${ACME_DEFAULT_CHUNK_SIZE:450}
    default-overlap: ${ACME_DEFAULT_OVERLAP:60}
    default-top-k: ${ACME_DEFAULT_TOP_K:3}

server:
  port: 8080
