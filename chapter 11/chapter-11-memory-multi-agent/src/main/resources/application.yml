spring:
  application:
    name: chapter-11-memory-multi-agent
  datasource:
    url: ${ACME_DB_URL:jdbc:postgresql://localhost:5432/acme_assistant}
    username: ${ACME_DB_USERNAME:postgres}
    password: ${ACME_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1}
          temperature: ${OLLAMA_TEMPERATURE:0.1}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true

server:
  port: ${ACME_ASSISTANT_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.acme.assistant.chapter11: INFO

acme:
  assistant:
    coordinator-system-prompt: >
      You are the Acme Coordinator Agent. Delegate specialist work,
      combine specialist outputs, preserve policy compliance, and respond with one unified answer.
    semantic-top-k: ${ACME_SEMANTIC_TOP_K:4}
    short-term-window-size: ${ACME_SHORT_TERM_WINDOW:10}
    mcp:
      hr-base-url: ${ACME_HR_MCP_URL:http://localhost:8091}
      finance-base-url: ${ACME_FINANCE_MCP_URL:http://localhost:8092}
      operations-base-url: ${ACME_OPERATIONS_MCP_URL:http://localhost:8093}
