spring:
  application:
    name: chapter-09-tool-calling

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/acme_ai}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: ${OLLAMA_TEMPERATURE:0.2}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.acme.assistant: INFO

app:
  ai:
    model: ${OLLAMA_CHAT_MODEL:llama3.2}
    temperature: ${OLLAMA_TEMPERATURE:0.2}
    max-tokens: ${OLLAMA_MAX_TOKENS:400}
    rag-top-k: ${RAG_TOP_K:4}
