server:
  address: 127.0.0.1
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: acme-enterprise-assistant
  mvc:
    async:
      request-timeout: ${ACME_HTTP_ASYNC_TIMEOUT:75s}
  ai:
    model:
      chat: ollama
      embedding: none
    retry:
      max-attempts: 1
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2}
        num-predict: 512
acme:
  model:
    timeout: ${ACME_MODEL_TIMEOUT:60s}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
