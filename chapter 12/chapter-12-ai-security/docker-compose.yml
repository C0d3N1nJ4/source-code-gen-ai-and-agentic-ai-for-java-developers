services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: chapter12-postgres
    environment:
      POSTGRES_DB: chapter12
      POSTGRES_USER: chapter12
      POSTGRES_PASSWORD: chapter12
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: chapter12-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: chapter12-open-webui
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3000:8080"
    profiles:
      - ui

volumes:
  pg_data:
  ollama_data:
