spring:
  config:
    activate:
      on-profile: openai
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        enabled: true
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        enabled: true
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      audio:
        speech:
          enabled: false
        transcription:
          enabled: false
      image:
        enabled: false
      moderation:
        enabled: false
