services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chapter14-postgres
    environment:
      POSTGRES_DB: acme_ai
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: chapter14-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: chapter14-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: chapter14-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts/ai-alert-rules.yml:/etc/prometheus/ai-alert-rules.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.1.1
    container_name: chapter14-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.5.0
    container_name: chapter14-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4319:4317"

  grafana:
    image: grafana/grafana:11.1.4
    container_name: chapter14-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data:
  ollama_data: