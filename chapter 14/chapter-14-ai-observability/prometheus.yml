global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/ai-alert-rules.yml

scrape_configs:
  - job_name: chapter14-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]