groups:
  - name: acme-ai-alerts
    rules:
      - alert: AcmeAiResponseLatencyHigh
        expr: ai_response_latency > 5000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "AI response latency above 5 seconds"
          description: "Inspect Prompt Builder, LLM Invocation, and MCP Communication spans for bottlenecks."

      - alert: AcmeAiToolFailureRateHigh
        expr: ai_tools_failures > 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AI tool failure rate above threshold"
          description: "Review tool metrics and structured logs for authorization and retry failures."

      - alert: AcmeAiMcpTimeoutRateHigh
        expr: ai_mcp_failure_rate > 1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "MCP timeout rate above threshold"
          description: "Check finance-mcp and support-mcp availability and timeout traces."

      - alert: AcmeAiLowGroundingScore
        expr: ai_rag_similarity_score < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Grounding score below threshold"
          description: "Investigate vector search quality, retrieved documents, and prompt context composition."

      - alert: AcmeAiDailyTokenBudgetExceeded
        expr: ai_tokens_total > 1500000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Daily token usage above budget"
          description: "Review token per workflow/model and optimize prompt/context size."
