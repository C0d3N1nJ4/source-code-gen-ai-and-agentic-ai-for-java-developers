name: Version 2 foundation
on:
  pull_request:
    paths:
      - 'version-2/**'
      - '.github/workflows/version-2-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'version-2/**'
      - '.github/workflows/version-2-foundation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: version-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-2-test-results
          path: version-2/**/build/test-results/test/*.xml
