name: Chapter 3 local model smoke
on:
  pull_request:
    paths:
      - '.github/workflows/chapter-03-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ollama-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_MODEL: llama3.2
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      ACME_MODEL_TIMEOUT: 180s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Start local CPU model provider
        run: |
          docker run -d --name chapter3-ollama -p 127.0.0.1:11434:11434 ollama/ollama:0.17.5
          for i in $(seq 1 60); do
            if curl -fsS "$OLLAMA_BASE_URL/api/version"; then break; fi
            sleep 2
          done
          curl -fsS "$OLLAMA_BASE_URL/api/version"
          docker exec chapter3-ollama ollama pull "$OLLAMA_MODEL"
          docker image inspect ollama/ollama:0.17.5 --format '{{json .RepoDigests}}' | tee ollama-image-digest.json
          curl -fsS "$OLLAMA_BASE_URL/api/tags" | tee ollama-models.json
      - name: Execute real provider integration test
        run: ./gradlew :acme-enterprise-assistant:test -PliveModel=true --tests '*LiveModelTest' --rerun-tasks
      - name: Record evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-03-live-evidence
          path: |
            ollama-image-digest.json
            ollama-models.json
            acme-enterprise-assistant/build/test-results/test/*.xml
      - name: Stop local provider
        if: always()
        run: docker rm -f chapter3-ollama || true
